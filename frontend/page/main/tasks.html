{% extends "shared/base.html" %}

{% block content %}
<div id="tasks" class="page active">
    <!-- Header with Actions -->
    <div class="header">
        <div>
            <h2>Tasks & Deadlines</h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Track your study milestones and manage upcoming deadlines</p>
        </div>
        <button class="btn primary" id="btn-add-task">
            <span>+</span>
            <span>Add Task</span>
        </button>
    </div>

    <!-- View Switcher Tabs -->
    <div class="tabs" style="margin-bottom: 24px;">
        <button class="tab-btn active task-tab-btn" data-tab="list">
            <span>📋 List View</span>
        </button>
        <button class="tab-btn task-tab-btn" data-tab="gantt">
            <span>📅 Calendar & Timeline</span>
        </button>
    </div>

    <!-- 1. List View Section -->
    <div id="task-tab-list" class="task-tab-content">
        <!-- Filter Toolbar -->
        <div style="display: flex; gap: 12px; margin-bottom: 20px; align-items: center; background: var(--surface); padding: 14px 18px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow-sm); flex-wrap: wrap;">
            <div style="flex: 1; min-width: 220px; position: relative;">
                <input type="text" id="task-filter-label" placeholder="Search tasks or filter by label (e.g. dsa, code)..."
                    style="width: 100%; padding: 8px 12px 8px 34px; border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 13px; outline: none;">
                <span style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 14px; color: var(--text-muted); pointer-events: none;">🔍</span>
            </div>

            <select id="task-filter-priority" style="padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 13px; background: var(--surface); color: var(--text); outline: none;">
                <option value="all">All Priorities</option>
                <option value="5">Priority 5 (Urgent)</option>
                <option value="4">Priority 4 (High)</option>
                <option value="3">Priority 3 (Medium)</option>
                <option value="2">Priority 2 (Low)</option>
                <option value="1">Priority 1 (Lowest)</option>
            </select>

            <select id="task-sort" style="padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 13px; background: var(--surface); color: var(--text); outline: none;">
                <option value="deadline_asc">Sort: Deadline (Earliest)</option>
                <option value="deadline_desc">Sort: Deadline (Latest)</option>
                <option value="priority_desc">Sort: Priority (Highest)</option>
                <option value="priority_asc">Sort: Priority (Lowest)</option>
            </select>

            <select id="task-page-size" style="padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 13px; background: var(--surface); color: var(--text); outline: none;">
                <option value="5">5 per page</option>
                <option value="10" selected>10 per page</option>
                <option value="20">20 per page</option>
                <option value="50">50 per page</option>
            </select>
        </div>

        <!-- Task List Container -->
        <div id="task-list" class="list" style="margin-bottom: 24px;"></div>

        <!-- Pagination Bar -->
        <div class="pagination" style="display: flex; justify-content: center; gap: 12px; align-items: center;">
            <button class="btn outline btn-sm" id="btn-prev-page">← Previous</button>
            <span id="page-info" style="font-size: 13px; font-weight: 700; color: var(--text-secondary);">Page 1 / 1</span>
            <button class="btn outline btn-sm" id="btn-next-page">Next →</button>
        </div>
    </div>

    <!-- 2. Gantt & Calendar Timeline Section -->
    <div id="task-tab-gantt" class="task-tab-content" style="display: none;">
        <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-sm);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;">
                <div>
                    <h3 style="font-size: 16px; font-weight: 800; color: var(--text); margin: 0;">Monthly Timeline</h3>
                    <p style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">Interval Partitioning scheduling visualization</p>
                </div>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <button class="btn outline btn-sm" id="gantt-prev-month">◀ Previous</button>
                    <span id="gantt-month-display" style="font-weight: 800; min-width: 140px; text-align: center; font-size: 14px; color: var(--text);">Month Year</span>
                    <button class="btn outline btn-sm" id="gantt-next-month">Next ▶</button>
                </div>
            </div>

            <div id="gantt-chart-content" style="position: relative; overflow-x: auto; min-height: 120px;">
                <!-- Dynamically rendered by event.js -->
            </div>
        </div>
    </div>
</div>
{% endblock %}
