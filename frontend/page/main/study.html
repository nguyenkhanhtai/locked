{% extends "shared/base.html" %}

{% block content %}
<div id="study" class="page active" style="display: flex; flex-direction: column; height: 100%;">
    <!-- Workspace Header & Breadcrumbs -->
    <div class="header" style="flex-shrink: 0; margin-bottom: 20px;">
        <div>
            <h2>Study Workspace</h2>
            <div id="study-breadcrumbs" style="font-size: 13px; margin-top: 6px; display: flex; align-items: center; gap: 6px; color: var(--text-muted);">
                <!-- Dynamic breadcrumbs -->
            </div>
        </div>
    </div>

    <!-- Main Workspace Views Container -->
    <div id="study-content-area" style="flex: 1; display: flex; flex-direction: column; min-height: 0;">

        <!-- 1. PROJECTS VIEW -->
        <div id="view-projects" class="study-view" style="display: none; flex-direction: column; height: 100%;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div>
                    <h3 style="font-size: 17px; font-weight: 800; color: var(--text); margin: 0;">Your Study Projects</h3>
                    <p style="font-size: 13px; color: var(--text-muted); margin-top: 2px;">Organize your subjects, modules, and courses</p>
                </div>
                <button class="btn primary" id="btn-create-project">
                    <span>+</span>
                    <span>New Project</span>
                </button>
            </div>
            <div id="project-list" class="list" style="overflow-y: auto; flex: 1;"></div>
        </div>

        <!-- 2. PROJECT DETAILS VIEW -->
        <div id="view-project-details" class="study-view" style="display: none; flex-direction: column; height: 100%;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-shrink: 0; flex-wrap: wrap; gap: 12px;">
                <div>
                    <h3 id="project-details-title" style="font-size: 18px; font-weight: 800; color: var(--text); margin: 0;">Project Details</h3>
                    <p id="project-details-desc" style="font-size: 13px; color: var(--text-muted); margin-top: 2px;"></p>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn outline btn-sm" id="btn-create-subproject">+ Sub-project</button>
                    <button class="btn outline btn-sm" id="btn-create-problem">+ Problem</button>
                    <button class="btn primary btn-sm" id="btn-create-project-record">+ Note / Record</button>
                </div>
            </div>

            <div style="overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 24px; padding-right: 4px;">
                <!-- Sub-projects section -->
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border);">
                        <span style="font-size: 14px; font-weight: 700; color: var(--text);">📁 Sub-projects</span>
                    </div>
                    <div id="subproject-list" class="list"></div>
                </div>

                <!-- Problems section -->
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border);">
                        <span style="font-size: 14px; font-weight: 700; color: var(--text);">📋 Problems (Kanban)</span>
                    </div>
                    <div id="problem-list" class="list"></div>
                </div>

                <!-- Records section -->
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border);">
                        <span style="font-size: 14px; font-weight: 700; color: var(--text);">📝 Notes & Records</span>
                    </div>
                    <div id="project-record-list" class="list"></div>
                </div>
            </div>
        </div>

        <!-- 3. PROBLEM VIEW (KANBAN) -->
        <div id="view-problem" class="study-view" style="display: none; flex-direction: column; height: 100%;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-shrink: 0; gap: 16px;">
                <input type="text" id="problem-title" placeholder="Problem Title..."
                    style="font-size: 20px; font-weight: 800; border: none; background: transparent; color: var(--text); flex: 1; outline: none; border-bottom: 2px solid transparent; padding: 4px; transition: border-color var(--transition);">
                <div style="display: flex; gap: 10px;">
                    <button class="btn outline btn-sm" id="btn-toggle-problem-desc">Toggle Description</button>
                    <button class="btn primary btn-sm" id="btn-create-column">+ Add Column</button>
                </div>
            </div>

            <!-- Problem Description Area -->
            <div id="problem-desc-container" style="display: flex; gap: 16px; margin-bottom: 16px; height: 160px; flex-shrink: 0;">
                <textarea id="problem-description-editor" placeholder="Write problem statement, hypotheses, or context in markdown..."
                    style="flex: 1; resize: none; border-radius: var(--radius); border: 1px solid var(--border); padding: 14px; font-family: inherit; font-size: 13px; outline: none; line-height: 1.6; display: none;"></textarea>
                <div id="problem-description-preview" class="content-md"
                    style="flex: 1; border-radius: var(--radius); border: 1px solid var(--border); padding: 14px; background: var(--surface); overflow-y: auto; display: block; cursor: text; box-shadow: var(--shadow-sm);"></div>
            </div>

            <!-- Kanban Columns Container -->
            <div id="problem-kanban" class="kanban-board">
                <!-- Columns dynamically injected -->
            </div>
        </div>

        <!-- 4. RECORD VIEW (MARKDOWN & LATEX) -->
        <div id="view-record" class="study-view" style="display: none; flex-direction: column; height: 100%;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-shrink: 0; gap: 16px;">
                <input type="text" id="record-title" placeholder="Note Title..."
                    style="font-size: 20px; font-weight: 800; border: none; background: transparent; color: var(--text); flex: 1; outline: none; border-bottom: 2px solid transparent; padding: 4px;">
                <div style="display: flex; gap: 10px; align-items: center;">
                    <span id="record-save-indicator" style="font-size: 12px; color: var(--text-muted);">Saved</span>
                    <button class="btn outline btn-sm" id="btn-toggle-preview">Toggle Edit Mode</button>
                </div>
            </div>

            <div style="display: flex; gap: 16px; flex: 1; min-height: 0; position: relative;">
                <textarea id="record-editor" placeholder="Type notes using Markdown and LaTeX ($...$ for inline, $$...$$ for block). Type @ to mention..."
                    style="flex: 1; resize: none; border-radius: var(--radius); border: 1px solid var(--border); padding: 16px; font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; font-size: 14px; outline: none; line-height: 1.6; display: none;"></textarea>
                
                <!-- Mention Dropdown Menu -->
                <div id="mention-dropdown" style="position: absolute; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-xl); max-height: 250px; overflow-y: auto; z-index: 100; width: 320px; display: none; flex-direction: column;"></div>
                
                <div id="record-preview" class="content-md"
                    style="flex: 1; border-radius: var(--radius); border: 1px solid var(--border); padding: 24px; background: var(--surface); overflow-y: auto; display: block; cursor: text; box-shadow: var(--shadow-sm);"></div>
            </div>
        </div>

    </div>
</div>

<!-- Study Generic Input Modal -->
<div class="overlay hidden" id="study-overlay"></div>
<div class="modal-box hidden" id="study-modal" style="max-width: 480px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 id="study-modal-title" style="font-size: 18px; font-weight: 800; color: var(--text); margin: 0;">New Item</h3>
        <button type="button" class="btn ghost btn-sm" id="btn-close-study-modal" style="font-size: 16px;">✕</button>
    </div>
    <form id="study-form">
        <div class="form-group">
            <label id="study-label-title">Title:</label>
            <input type="text" id="study-input-title" required placeholder="Enter title...">
        </div>
        <div class="form-group" id="study-group-desc">
            <label>Description (optional):</label>
            <textarea id="study-input-desc" rows="3" placeholder="Optional notes..."></textarea>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px;">
            <button type="button" class="btn outline" id="btn-cancel-study-modal">Cancel</button>
            <button type="submit" class="btn primary">Save</button>
        </div>
    </form>
</div>
{% endblock %}
